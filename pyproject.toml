[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-alpaca-connector"
version = "2.0.0"
description = "A secure Alpaca paper-trading MCP connector for ChatGPT"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py==0.43.5",
  "mcp==1.21.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_connector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
